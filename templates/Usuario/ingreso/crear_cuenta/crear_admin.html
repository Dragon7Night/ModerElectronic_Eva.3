{% extends 'Base/base_index.html' %}

<!-- °============================================° -->
<!--    °Formulario -> Registro del administrador   -->
<!-- °============================================° -->

<!-- TITULO DE LA PAGINA WEB -->
{% block titulo %} REGISTRO ADMINISTRADOR {% endblock %}

<!-- CONTENIDO DEL FORMULARIO DE REGISTRO -->
{% block contenido %}

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="p-5">
            <div class="text-center">
                <h1 class="mb-1">Registro de cuenta</h1>
                <h4 class="barra_inferior text-light">Administrador</h4>
                <p class="text-danger small mt-2">Se requiere una clave de acceso secreta.</p>
            </div>

            <form class="row g-3 user" method="post">
                {% csrf_token %}

                <!-- UserName -->
                <div class="col-12">
                    <label for="id_username" class="form-label color-label">Nombre de usuario</label>
                    <input type="text" class="form-control form-control-user" id="id_username" name="username"
                        placeholder="Nombre de usuario" value="{{ form.username.value|default:'' }}" required autofocus>
                </div>

                <!-- Email -->
                <div class="col-12">
                    <label for="id_email" class="form-label color-label">Correo electronico</label>
                    <input type="email" class="form-control form-control-user" id="id_email" name="email"
                        placeholder="nombre@ejemplo.com" value="{{ form.email.value|default:'' }}" required>
                </div>

                <!-- Clave de acceso -->
                <div class="col-12">
                    <label for="id_admin_key" class="form-label color-label">Clave de acceso administrativa</label>
                    <input type="password" class="form-control form-control-user" id="id_admin_key" name="admin_key"
                        placeholder="Ingrese la clave secreta" required>
                </div>

                <!-- Contraseña N°1 -->
                <div class="col-md-6">
                    <label for="id_password1" class="form-label color-label">Contraseña</label>
                    <input type="password" class="form-control form-control-user" id="id_password1" name="password1"
                        placeholder="Contraseña" required>
                </div>

                <!-- Contraseña N°2 -->
                <div class="col-md-6">
                    <label for="id_password2" class="form-label color-label">Repetir Contraseña</label>
                    <input type="password" class="form-control form-control-user" id="id_password2" name="password2"
                        placeholder="Repetir Contraseña" required>
                </div>

                <hr class="my-2">

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-warning btn-user btn-block w-100 mb-2">Crear cuenta</button>
                </div>
            </form>

            <hr class="mt-3">

            <div class="text-center mt-2">
                <a class="small" href="{% url 'iniciarSesionAdmin' %}">¿Ya tienes una cuenta? Inicia sesión</a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
