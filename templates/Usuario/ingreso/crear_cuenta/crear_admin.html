{% extends 'Base/base_index.html' %}

<!-- °============================================° -->
<!--    °Formulario -> Registro del administrador   -->
<!-- °============================================° -->

<!-- TITULO DE LA PAGINA WEB -->
{% block titulo %} REGISTRO ADMINISTRADOR {% endblock %}

<!-- CONTENIDO DEL FORMULARIO DE REGISTRO -->
{% block contenido %}

<div class="row justify-content-center">
    <div class="col-lg-12">
        <div class="p-5">
            <div class="text-center">
                <h1 class="mb-1">Registro de cuenta</h1>
                <h4 class="barra_inferior text-light">Administrador</h4>
                <p class="text-info small">Se requiere una clave de acceso secreta.</p>
            </div>

            <form class="user" method="post" novalidate>
                {% csrf_token %}


                <!-- UserName del Admin -->
                <div class="form-group mb-3">
                    <input type="text"
                        class="form-control form-control-user"
                        id="id_username" name="username" placeholder="Nombre de usuario"
                        value="{{ form.username.value|default:'' }}" required autofocus>

                </div>

                <!-- Correo electronico del admin-->
                <div class="form-group mb-3">
                    <input type="email"
                        class="form-control form-control-user"
                        id="id_email" name="email" placeholder="Correo Electrónico"
                        value="{{ form.email.value|default:'' }}" required>

                </div>

                <!-- Clave de acceso del administrador -->
                <div class="form-group mb-3">
                    <input type="password"
                        class="form-control form-control-user"
                        id="id_admin_key" name="admin_key" placeholder="Clave de Administrador Secreta" required>

                </div>

                <!-- Solicitud de contraseñas al admin -->
                <div class="form-group row mb-3">
                    <!-- Contraseña N°1 -->
                    <div class="col-sm-6 mb-3 mb-sm-0">
                        <input type="password"
                            class="form-control form-control-user"
                            id="id_password1" name="password1" placeholder="Contraseña" required>

                    </div>

                    <!-- Contraseña N°2 -->
                    <div class="col-sm-6">
                        <input type="password"
                            class="form-control form-control-user"
                            id="id_password2" name="password2" placeholder="Repetir Contraseña" required>

                    </div>
                </div>

                <!-- Boton de registro del administrador -->
                <button type="submit" class="btn btn-warning btn-user btn-block">Registrar Administrador</button>
            </form>

            <hr>

            <!-- Enlaces relevantes -->
            <div class="text-center">
                <a class="small" href="{% url 'iniciarSesionAdmin' %}">¿Ya tienes una cuenta? Inicia sesión</a>
            </div>
            <div class="text-center">
                <a class="small" href="{% url 'crearCuentaCliente' %}">Registro de Cliente</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
