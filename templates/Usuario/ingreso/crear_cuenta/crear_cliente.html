{% extends 'Base/base_index.html' %}

<!-- °============================================° -->
<!--    °Formulario -> Registro del cliente         -->
<!-- °============================================° -->

<!-- TITULO DE LA PAGINA WEB -->
{% block titulo %} REGISTRO CLIENTE {% endblock %}


<!-- CONTENIDO DEL FORMULARIO DE REGISTRO -->
{% block contenido %}

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="p-5">
            <div class="text-center">
                <h1 class="mb-1">Registro de cuenta</h1>
                <h4 class="barra_inferior text-light">Cliente</h4>
            </div>

            <form class="row g-3 user" method="post">
                {% csrf_token %}

                <!-- UserName -->
                <div class="col-12">
                    <label for="id_username" class="form-label color-label">Nombre de usuario</label>
                    <input type="text" class="form-control form-control-user" id="id_username" name="username"
                        placeholder="Nombre de usuario" value="{{ form.username.value|default:'' }}" required autofocus>

                </div>

                <!-- Correo electronico -->
                <div class="col-12">
                    <label for="id_email" class="form-label color-label">Correo electrónico</label>
                    <input type="email" class="form-control form-control-user" id="id_email" name="email"
                        placeholder="nombre@ejemplo.com" value="{{ form.email.value|default:'' }}" required>

                </div>

                <!-- Direccion -->
                <div class="col-12">
                    <label for="id_direccion" class="form-label color-label">Dirección de envío</label>
                    <input type="text" class="form-control form-control-user" id="id_direccion" name="direccion"
                        placeholder="Dirección de envío" value="{{ form.direccion.value|default:'' }}" required>

                </div>

                <!-- Contraseña N°1 -->
                <div class="col-md-6">
                    <label for="id_password1" class="form-label color-label">Contraseña</label>
                    <input type="password" class="form-control form-control-user" id="id_password1" name="password1"
                        placeholder="Contraseña" required>
                </div>

                <!-- Contraseña N°2 -->
                <div class="col-md-6">
                    <label for="id_password2" class="form-label color-label">Repetir Contraseña</label>
                    <input type="password" class="form-control form-control-user" id="id_password2" name="password2"
                        placeholder="Repetir Contraseña" required>

                </div>

                <hr class="my-2">

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary btn-user btn-block w-100 mb-2">Crear Cuenta</button>
                </div>
            </form>

            <hr class="mt-3">

            <div class="text-center mt-2">
                <a class="small" href="{% url 'iniciarSesionCliente' %}">¿Ya tienes una cuenta? Inicia sesión</a>
            </div>

        </div>
    </div>
</div>

{% endblock %}





<!-- 

value="{{ form.username.value|default:'' }}
+ permite conservar lo valores en caso de que el user se equivoque y se recarge la pagina


-->
