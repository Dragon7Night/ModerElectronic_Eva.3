{% extends 'Base/base_index.html' %}

<!-- °======================================================° -->
<!--    °Pagina -> Selección del método de recarga          -->
<!-- °======================================================° -->

{% block titulo %} Selección de Método {% endblock %}

{% block contenido %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg border-0 rounded-4" style="max-width: 600px; width: 100%;">
        
        <div class="card-header text-center rounded-top-4 py-4">
            <h3 class="mb-0 fw-light txt-grey text-uppercase">
                <i class="bi bi-wallet-fill me-2"></i> Seleccione el metodo para recargar su billetera
            </h3>
        </div>

        <div class="card-body text-center p-4">

            <p class="fs-5 fw-semibold text-secondary mb-4">
                Elige cómo deseas recargar tu billetera digital:
            </p>

            <div class="row g-3 justify-content-center">

                <!-- Opción disponible -->
                <div class="col-12 col-md-10">
                    <a href="{% url 'recargarBilletera' %}"
                       class="btn btn-success text-light btn-lg w-100 py-3 rounded-3 d-flex justify-content-center align-items-center gap-2">
                        <i class="bi bi-credit-card-2-front fs-4"></i>
                        <span>Recargar con Tarjeta de Débito</span>
                    </a>
                </div>

                <!-- Opción deshabilitada -->
                <div class="col-12 col-md-10">
                    <button class="btn btn-outline-secondary btn-lg w-100 py-3 rounded-3 d-flex justify-content-center align-items-center gap-2" disabled>
                        <i class="bi bi-credit-card fs-4"></i>
                        <span>Tarjeta de Crédito (Próximamente)</span>
                    </button>
                </div>

            </div>

            <div class="mt-4 text-muted small">
                <i class="bi bi-info-circle"></i> Nuevos métodos se habilitarán pronto.
            </div>

        </div>
    </div>
</div>
{% endblock %}
