<!DOCTYPE html>
{% load static %}
<html lang="es-CL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModerElectronic</title>

    {% include 'menus/importaciones_general.html' %}

    <style>
        h1 {
            text-align: center;
            color: #ff5733;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .btn-registro {
            background-color: #ff5733 !important;
            border-color: #ff5733 !important;
        }
    </style>
</head>

<body
    class="home wp-singular page-template page-template-elementor_header_footer page page-id-2 wp-theme-hello-elementor elementor-default elementor-template-full-width elementor-kit-7 elementor-page elementor-page-2">

    {% include 'menus/topBar.html' %}

    <div data-elementor-type="wp-page" data-elementor-id="2" class="elementor elementor-2">

        <section
            class="elementor-section elementor-top-section elementor-element elementor-element-afe831e elementor-section-full_width elementor-section-height-default elementor-section-height-default"
            data-id="afe831e" data-element_type="section"
            data-settings="{&quot;background_background&quot;:&quot;classic&quot;}">

            <div class="elementor-container elementor-column-gap-no">
                <div class="elementor-column elementor-col-100 elementor-top-column elementor-element elementor-element-5c81575"
                    data-id="5c81575" data-element_type="column">

                    <div class="elementor-widget-wrap elementor-element-populated">
                        <div class="mb-5 shadow-lg p-3">
                        </div>

                        <h1>{{txtForm}}</h1>

                        <div class="row pb-5 justify-content-center">
                            <div class="col-12 col-md-6 col-lg-4 pb-5 mx-auto">
                                <div class="card shadow-lg border-radius"
                                    style="background-color: #f8f9fa !important; text-align: left;">
                                    <div class="card-body">

                                        <!-- FORMULARIO ADENTRO DEL CARD -->
                                        <form method="post">
                                            {% csrf_token %}
                                            {{formKey.as_p}}
                                            <div class="d-grid mt-4">
                                                <input type="submit" class="btn btn-primary btn-registro"
                                                    value="{{txtBtn}}">
                                            </div>
                                        </form>
                                        <!-- FIN DEL FORMULARIO -->

                                    </div>
                                </div>
                            </div>
                        </div>

                    </div> <!-- cierre widget wrap -->
                </div> <!-- cierre columna -->
            </div> <!-- cierre container -->

        </section>
    </div>

    {% include 'menus/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
